# CI de la librería SKILL MAESTRO (no se copia a los proyectos: su CI sale de .agents/templates/ci_workflow_template.yml)
name: Librería

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Windows no se prueba en CI a propósito: los scripts son bash y se soporta mediante WSL 2
        # (que es Linux y queda cubierto por ubuntu-latest). Ver "Requisitos y uso en Windows" en QUICKSTART.md.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
      - name: Configurar identidad de git para los proyectos temporales
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Pruebas de scripts (task.sh, hooks, init-project, scan-secrets)
        run: bash tests/test-scripts.sh
      - name: Flujo completo de una tarea (integración)
        run: bash tests/test-flow.sh
      - name: Linter estructural de skills (5 pilares y enlaces)
        run: bash tests/test-skills.sh
      - name: Línea base de las evals (FAIL_INIT, sin LLM)
        run: python3 tests/evals/run_evals.py --verify-baselines --jobs 4
      - name: Lint de descripciones de skills
        run: python3 tests/triggers/lint_descriptions.py
      - name: JSON válidos
        run: |
          for f in tests/triggers/cases.json tests/evals/evals.json .agents/templates/*.json .mcp.json; do
            python3 -m json.tool "$f" >/dev/null || { echo "❌ $f"; exit 1; }
          done
