name: Multi-Agent Quality & Security Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  agent-governance-audit:
    name: Auditoría de Reglas de Agentes y Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: 1. Auditar Estado Global (validate-state.sh)
        run: |
          if [ -f "GLOBAL_STATE.md" ] && [ -f ".agents/scripts/validate-state.sh" ]; then
            chmod +x .agents/scripts/validate-state.sh
            ./.agents/scripts/validate-state.sh GLOBAL_STATE.md
          else
            echo "GLOBAL_STATE.md no presente o en setup inicial."
          fi

      - name: 2. Escaneo de Secretos Expuestos
        run: bash .agents/scripts/scan-secrets.sh --all

      - name: 3. Verificar Convención de Commits en Pull Request
        if: github.event_name == 'pull_request'
        run: |
          COMMITS=$(git log --no-merges --pretty=format:"%s" origin/${{ github.base_ref }}..HEAD)
          PATTERN="^(feat|fix|test|docs|refactor|perf|chore|style|build|ci)\(TASK-[0-9]+\): .+$"
          FAILED=0
          while IFS= read -r commit; do
            if [ -n "$commit" ] && ! echo "$commit" | grep -qE "$PATTERN"; then
              echo "❌ Commit no convencional: '$commit'"
              FAILED=1
            fi
          done <<< "$COMMITS"
          if [ $FAILED -eq 1 ]; then
            echo "Usa el formato: tipo(TASK-XXX): descripción"
            exit 1
          else
            echo "✅ Todos los commits siguen la convención de tareas."
          fi

  build-and-test:
    name: Compilación y Pruebas Automatizadas (Node 24 / Python 3.12)
    needs: agent-governance-audit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # --- Stack Node.js 24 (Next.js, Angular, Express) ---
      - name: Configurar Node.js 24
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias Node
        if: hashFiles('package.json') != ''
        run: npm ci || npm install

      - name: Lint y tipos Node
        if: hashFiles('package.json') != ''
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Ejecutar pruebas Node
        if: hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Compilar proyecto Node
        if: hashFiles('package.json') != ''
        run: npm run build --if-present

      # --- Stack Python 3.12 (FastAPI / pyproject.toml / requirements.txt) ---
      - name: Configurar Python 3.12
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias Python
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f "pyproject.toml" ]; then
            PKG_MODE=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); has_pkg='project' in d or 'build-system' in d; has_dev='dev' in d.get('project',{}).get('optional-dependencies',{}); print('dev' if (has_pkg and has_dev) else ('pkg' if has_pkg else 'none'))")
            if [ "$PKG_MODE" = "dev" ]; then
              pip install -e ".[dev]"
            elif [ "$PKG_MODE" = "pkg" ]; then
              pip install -e .
            fi
          fi
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Lint y formato Python (ruff)
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          if python -m ruff --version >/dev/null 2>&1; then
            python -m ruff check .
            python -m ruff format --check .
          else
            echo "ruff no instalado; comprobación de lint omitida."
          fi

      - name: Verificación de tipos Python (mypy)
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          if python -m mypy --version >/dev/null 2>&1 && [ -d "app" ]; then
            python -m mypy app
          else
            echo "mypy o directorio app/ no presente; omitido."
          fi

      - name: Ejecutar pruebas Python (pytest)
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          if python -m pytest --version >/dev/null 2>&1; then
            python -m pytest
          else
            echo "pytest no instalado; pruebas Python omitidas."
          fi

      - name: Verificar compilación bytecode / build Python
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          python -m compileall -q -x '(\.git|\.venv|venv|node_modules)' .
          if [ -f "pyproject.toml" ] && python -m build --version >/dev/null 2>&1; then
            python -m build --no-isolation
          fi
